name: Bootstrap dev from production

on:
  push:
    paths:
      - '.github/workflows/bootstrap-dev.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev repository
        uses: actions/checkout@v4
        with:
          path: dev

      - name: Checkout production repository
        uses: actions/checkout@v4
        with:
          repository: Penta2026/michinotochu-pwa
          ref: main
          path: prod

      - name: Mirror production into dev
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/dev"
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          rsync -a --delete --exclude='.git/' --exclude='.github/workflows/' "$GITHUB_WORKSPACE/prod/" ./
          touch .nojekyll

      - name: Commit mirrored app
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/dev"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Bootstrap development copy from production"
          git push origin main
