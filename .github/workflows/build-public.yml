name: Build public package

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install build dependencies
        run: npm install --no-audit --no-fund

      - name: Build public package
        run: npm run build

      - name: Verify private/dev-only files are absent
        shell: bash
        run: |
          test ! -e dist/docs
          test ! -e dist/scripts
          test ! -e dist/.github
          test ! -e dist/package.json
          ! grep -R -n -E 'GOLDEN VALLEY|golden_valley1777|rc_hiroshima_golden_valley_001' dist || exit 1

      - name: Upload public build artifact
        uses: actions/upload-artifact@v4
        with:
          name: michinotochu-public-build
          path: dist/
          if-no-files-found: error
          retention-days: 14
